name: CD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (leave empty for ref tag)"
        required: false
        type: string

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Run backend tests
        run: |
          pip install -r backend/requirements.txt -r requirements-dev.txt
          ruff check .
          pytest -v tests/test_smoke.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend typecheck
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit

      - name: Check required PRODUCTION_API_URL variable
        run: |
          if [ -z "${{ vars.PRODUCTION_API_URL }}" ]; then
            echo "::error ::Repository variable PRODUCTION_API_URL is missing. Please set it in GitHub Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

  publish:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nutrisync-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=cd-backend
          cache-to: type=gha,mode=max,scope=cd-backend

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nutrisync-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=cd-frontend
          cache-to: type=gha,mode=max,scope=cd-frontend

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish]
    environment: production
    # Disabled by default until production host is configured
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Checkout repository for compose spec
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Working example for SSH deployment to a plain Linux VPS
      # Requires GitHub Secrets: SSH_HOST, SSH_USER, SSH_KEY
      # -----------------------------------------------------------------------
      # - name: Deploy to VPS via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_KEY }}
      #     script: |
      #       set -e
      #       mkdir -p /opt/nutrisync
      #       cd /opt/nutrisync
      #       echo "Logging in to GHCR..."
      #       echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #       export REGISTRY_OWNER="${{ github.repository_owner }}"
      #       export IMAGE_TAG="${{ github.ref_name }}"
      #       docker compose -f docker-compose.prod.yml pull
      #       docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Post-deploy smoke check
        run: |
          echo "Running post-deploy health check against ${{ vars.PRODUCTION_API_URL }}/health..."
          status=$(curl -fsS -o /dev/null -w "%{http_code}" "${{ vars.PRODUCTION_API_URL }}/health" || echo "000")
          if [ "$status" != "200" ]; then
            echo "::error ::Deployment health check failed with status $status"
            exit 1
          fi
          echo "Deployment verified successfully!"
