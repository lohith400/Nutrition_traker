# Keeps the Render free service awake so users never hit the 30-60 s cold start.
# Render free sleeps after 15 min without traffic; this pings /health every 10 min (free, no extra service).
#
# One-time setup (GitHub -> your repo -> Settings -> Secrets and variables -> Actions -> Variables tab):
#   New repository variable   BACKEND_URL   =   https://<your-service>.onrender.com
# (No trailing slash. Nothing secret: /health is public.)
#
# Notes:
#  * GitHub may delay scheduled runs by a few minutes at busy times, and pauses scheduled workflows on
#    repositories with no activity for 60 days -- just push any commit (or click "Run workflow") to resume.
#  * Render's free plan gives 750 instance-hours a month, enough to keep ONE service awake 24/7.
#  * Prefer not to use GitHub for this? A free UptimeRobot HTTP monitor (5 min interval) on the same URL does the same job.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping /health (retries while the server wakes up)
        env:
          URL: ${{ vars.BACKEND_URL }}
        run: |
          for i in 1 2 3 4; do
            if curl -fsS --max-time 60 "${URL%/}/health"; then echo; echo "backend is awake"; exit 0; fi
            echo "attempt $i failed, retrying..."; sleep 10
          done
          echo "backend did not answer"; exit 1
